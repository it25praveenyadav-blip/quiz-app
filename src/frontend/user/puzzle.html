<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle Solve</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body class="levels-bg">
  <a href="levels.html" class="home-btn">🗺 Levels</a>

  <main class="puzzle-frame">
    <h1 class="wood-title">🧩 PUZZLE SOLVE</h1>
    <div class="puzzle-info">
      <span id="puzzleLevel">LEVEL 1</span>
      <span id="puzzleMoves">Moves: 0</span>
    </div>
    <p class="puzzle-instructions" id="puzzleInstructions">Arrange the numbers in order. Tap a tile beside the empty space to move it.</p>
    <div class="puzzle-board" id="puzzleBoard" role="group" aria-label="Sliding number puzzle"></div>
    <div class="puzzle-actions">
      <button class="wood-btn" id="puzzleShuffleBtn" type="button">↻ Shuffle</button>
      <button class="wood-btn" id="puzzleMenuBtn" type="button">☰ Menu</button>
    </div>
  </main>

  <div class="puzzle-overlay" id="puzzleMenu" role="dialog" aria-modal="true" aria-labelledby="puzzleMenuTitle" hidden>
    <div class="puzzle-dialog">
      <h2 id="puzzleMenuTitle">Puzzle Menu</h2>
      <button class="wood-btn-full" id="puzzleResumeBtn" type="button">▶ Resume</button>
      <button class="wood-btn" id="puzzleRestartBtn" type="button">↻ Restart Puzzle</button>
      <button class="wood-btn" id="puzzleLevelsBtn" type="button">🗺 Level Map</button>
      <button class="wood-btn" id="puzzleHomeBtn" type="button">🏠 Home</button>
    </div>
  </div>

  <div class="puzzle-overlay" id="puzzleComplete" role="dialog" aria-modal="true" aria-labelledby="puzzleCompleteTitle" hidden>
    <div class="puzzle-dialog puzzle-complete-dialog">
      <div class="puzzle-gift" aria-hidden="true">🎉</div>
      <h2 id="puzzleCompleteTitle">Puzzle Solved!</h2>
      <p id="puzzleResultText"></p>
      <p class="puzzle-result-stars" id="puzzleResultStars"></p>
      <button class="wood-btn-full" id="puzzleNextBtn" type="button">NEXT LEVEL ▶</button>
      <button class="wood-btn" id="puzzleCompleteLevelsBtn" type="button">🗺 Level Map</button>
    </div>
  </div>

  <script src="js/puzzle.js"></script>
</body>
</html>
