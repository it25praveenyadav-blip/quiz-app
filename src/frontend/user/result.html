<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Result</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body class="levels-bg">
  <a href="index.html" class="home-btn">🏠 Home</a>
  <button id="musicToggleBtn" onclick="toggleBgMusic()" style="position:fixed; top:20px; right:20px; z-index:10; background:#1a1a3d; border:2px solid #00f5ff; color:#00f5ff; border-radius:50%; width:44px; height:44px; font-size:1.1rem; cursor:pointer;">🔊</button>
  <canvas id="confettiCanvas"></canvas>

  <div class="wood-frame">
    <div class="parchment-inner" style="text-align:center;">
      <h2 class="wood-title" id="resultTitle">LEVEL COMPLETE!</h2>
      <p style="font-size:2.2rem; font-weight:900; color:#a06818; margin:15px 0;" id="finalScore">0 / 0</p>
      <p id="starsEarned" style="font-size:1.8rem; margin-bottom:15px;"></p>
      <div id="reviewSection"></div>
      <button class="wood-btn-full" id="nextLevelBtn">NEXT LEVEL ▶</button>
      <div class="wood-btn-row">
        <button class="wood-btn" onclick="window.location.href='levels.html'">LEVEL MAP</button>
        <button class="wood-btn" onclick="retryLevel()">RETRY</button>
      </div>
    </div>
  </div>

  <script src="js/result.js"></script>
  <script src="js/bgmusic.js"></script>
</body>
</html>
