<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select Level</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="levels-bg">
  <a href="index.html" class="home-btn">🏠 Home</a>
  <button id="musicToggleBtn" onclick="toggleBgMusic()" style="position:fixed; top:20px; right:20px; z-index:10; background:#1a1a3d; border:2px solid #00f5ff; color:#00f5ff; border-radius:50%; width:44px; height:44px; font-size:1.1rem; cursor:pointer;">🔊</button>

  <div class="level-panel">
    <div class="panel-title-badge">SELECT LEVEL</div>
    <button class="arrow-btn arrow-left" id="prevPage">◀</button>
    <button class="arrow-btn arrow-right" id="nextPage">▶</button>
    <div class="level-grid-8" id="levelGrid"></div>
    <div class="page-dots" id="pageDots"></div>
  </div>

  <div class="bottom-icon-row">
    <button class="icon-sq" onclick="window.location.href='leaderboard.html'">🏆</button>
    <button class="icon-sq" onclick="window.location.href='profile.html'">📊</button>
    <button class="icon-sq" onclick="window.location.href='settings.html'">❓</button>
    <button class="icon-sq" onclick="window.location.href='index.html'">🏠</button>
  </div>

  <script src="js/levels.js"></script>
  <script src="js/bgmusic.js"></script>
</body>
</html>
