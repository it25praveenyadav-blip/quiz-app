<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Puzzle Arena</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:24px 12px;font-family:'Trebuchet MS','Segoe UI',sans-serif;color:#3b2412;background-color:#1c1840;
    background-image:linear-gradient(180deg,rgba(0,0,0,.35) 0 6px,transparent 6px),linear-gradient(90deg,rgba(0,0,0,.35) 0 6px,transparent 6px),radial-gradient(circle at 15% 25%,rgba(190,60,200,.28),transparent 40%),radial-gradient(circle at 85% 75%,rgba(40,200,210,.22),transparent 40%);background-size:120px 60px,120px 60px,auto,auto}
  .frame{width:100%;max-width:480px;height:fit-content;padding:12px;border-radius:30px;background:linear-gradient(#a8693a,#6b4423);border:3px solid #c98f3c;box-shadow:0 14px 30px rgba(0,0,0,.5)}
  .panel{background:linear-gradient(160deg,#ebdfc0,#ddd0ab);border-radius:20px;padding:20px;min-height:420px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  h1{margin:0;font-size:22px} h3{margin:0 0 6px}
  .btn{cursor:pointer;font:inherit;font-weight:700;color:#3b2412;padding:8px 12px;border-radius:10px;background:linear-gradient(#ffe070,#e0a830);border:2px solid #9a5f1a;box-shadow:0 3px 0 #8a5217;text-decoration:none;display:inline-block}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5217}
  .btn.sel{background:linear-gradient(#e0a830,#c98d1f);outline:2px solid #3b2412}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .bar{display:flex;justify-content:space-around;padding:8px;margin-bottom:12px;border-radius:14px;background:linear-gradient(#7a4c27,#5a3519);color:#ffe27a;text-align:center;border:2px solid #a8693a}
  .bar small{display:block;font-size:11px;color:#fff3c4} .bar b{font-size:18px}
  .card{background:rgba(255,255,255,.4);border:2px solid #b98a4a;border-radius:12px;padding:12px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .q{font-size:18px;font-weight:700;margin:6px 0 10px;word-break:break-word}
  input{width:100%;padding:9px 10px;border-radius:8px;border:2px solid #b98a4a;background:#fff8e6;font:inherit;margin-bottom:8px}
  .ok{color:#2f6b34;font-weight:700} .bad{color:#a83030;font-weight:700} .meta{font-size:12px;opacity:.75}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#5a3519;color:#ffe27a}
  .river{display:grid;grid-template-columns:1fr 54px 1fr;gap:8px;align-items:start;margin:10px 0}
  .bank{min-height:96px;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center}
  .bank.L{background:#cfe0a8}.bank.R{background:#cfe0a8}
  .water{background:#8ec5e8;border-radius:10px;min-height:96px;display:flex;align-items:center;justify-content:center;font-size:26px}
  .it{font-size:26px;padding:4px 14px}
  .row-board{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px dashed #b98a4a;font-size:14px}
</style>
</head>
<body>
<div class="frame"><div class="panel">
  <header><h1>🧠 Brain Puzzle Arena</h1><a class="btn" href="index.html">← Back</a></header>
  <div id="view"></div>
</div></div>

<script>
const API = "/api", KEYS = ["username","user","currentUser","loggedInUser"]; // apni login key yahan add karo
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function getUser(){
  for (const st of [localStorage, sessionStorage]) for (const k of KEYS) {
    const v = st.getItem(k); if (!v) continue;
    try { const o = JSON.parse(v); if (typeof o === "string") return o; if (o && o.username) return o.username; continue; } catch(e){ return v; }
  } return null;
}
const user = getUser();
async function api(p, o){ const r = await fetch(API + p, o); if (!r.ok) throw new Error(r.status); return r.json(); }
const post = (p, b) => api(p, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(b)});

/* ---------- Hub ---------- */
function hub(){
  clearInterval(T);
  $("view").innerHTML = `<div class="grid">
    <div class="card"><h3>🔢 Secret Code</h3><div class="meta">Number patterns</div><br><button class="btn" onclick="pick('code')">Play</button></div>
    <div class="card"><h3>🔐 Hack the Cipher</h3><div class="meta">Decode messages</div><br><button class="btn" onclick="pick('cipher')">Play</button></div>
    <div class="card"><h3>🛶 River Crossing</h3><div class="meta">Wolf, goat, cabbage</div><br><button class="btn" onclick="river()">Play</button></div>
    <div class="card"><h3>⚡ Brain Battle</h3><div class="meta">60 seconds, max score</div><br><button class="btn" onclick="battleIntro()">Play</button></div>
    <div class="card"><h3>🕵️ Detective</h3><div class="meta">Who is the killer?</div><br><button class="btn" onclick="run('detective',0)">Play</button></div>
    <div class="card"><h3>🪑 Who Sits Where?</h3><div class="meta">Seating logic</div><br><button class="btn" onclick="run('seat',0)">Play</button></div>
    <div class="card"><h3>👁 Hidden Anomaly</h3><div class="meta">15 seconds</div><br><button class="btn" onclick="pick('anomaly')">Play</button></div>
    <div class="card"><h3>🚪 Digital Room</h3><div class="meta">3 locks, 90 seconds</div><br><button class="btn" onclick="escape()">Play</button></div>
    <div class="card"><h3>🎨 Visual IQ</h3><div class="meta">Spot the pattern</div><br><button class="btn" onclick="run('visual',0)">Play</button></div>
  </div><button class="btn" onclick="board()">🏆 Leaderboard</button>`;
}

function pick(game){
  $("view").innerHTML = `<div class="card"><h3>${({code:"Secret Code",cipher:"Hack the Cipher",anomaly:"Hidden Anomaly"})[game]}: choose level</h3>
    <button class="btn" onclick="run('${game}',1)">Level 1 · Intermediate (10 pts)</button><br><br>
    <button class="btn" onclick="run('${game}',2)">Level 2 · Hard (20 pts)</button><br><br>
    <button class="btn" onclick="run('${game}',3)">Level 3 · Expert (30 pts)</button></div>
    <button class="btn" onclick="hub()">← Menu</button>`;
}

/* ---------- Question runner (practice + battle) ---------- */
let T, S = {};
async function run(game, level, battle=false){
  S = {game, level, battle, score: S.battle===battle && S.keep ? S.score : 0, att: S.keep ? S.att : 0, ok: S.keep ? S.ok : 0, locked:false, keep:S.keep};
  await loadQ();
}
async function loadQ(){
  try {
    const q = await api(`/arena/q?game=${S.game}&level=${S.level}&username=${encodeURIComponent(user)}`);
    S.q = q; S.locked = false; drawQ();
  } catch(e){ $("view").innerHTML = "<div class='card bad'>Server connect nahi ho paya.</div><button class='btn' onclick='hub()'>← Menu</button>"; }
}
function drawQ(){
  const q = S.q, hasOpts = q.options.length > 0;
  if (q.game === "anomaly") return drawAnomaly();
  $("view").innerHTML = `
    <div class="bar"><div><small>Score</small><b id="sc">${S.score}</b></div><div><small>Correct</small><b>${S.ok}/${S.att}</b></div>
    ${S.battle?`<div><small>Time</small><b id="tm">${S.t}</b></div>`:""}</div>
    <div class="card"><span class="badge">Level ${q.level} · ${["","Intermediate","Hard","Expert"][q.level]}</span>
    <div class="q">${esc(q.prompt)}</div>
    ${hasOpts ? `<div class="opts">${q.options.map(o=>`<button class="btn" onclick="submit('${esc(o)}')">${esc(o)}</button>`).join("")}</div>`
              : `<input id="ans" placeholder="Decoded message" autocomplete="off" onkeydown="if(event.key==='Enter')submit()"><button class="btn" onclick="submit()">Submit</button>`}
    <div id="fb" style="margin-top:10px"></div></div>
    <button class="btn" onclick="${S.battle?"endBattle()":"S.keep=false;hub()"}">${S.battle?"End now":"← Menu"}</button>`;
  const a = $("ans"); if (a) a.focus();
}
async function submit(val){
  if (S.locked) return;                                  // double-click se duplicate submit nahi hoga
  const answer = val ?? $("ans").value;
  if (!answer.trim()) return;
  S.locked = true;
  try {
    const r = await post("/arena/a", {username:user, token:S.q.token, answer, battle:S.battle});
    if (r.expired) return endBattle();
    if (r.error) { $("fb").innerHTML = `<span class="bad">${esc(r.error)}</span>`; return; }
    S.att++; if (r.correct){ S.ok++; S.score += r.points; }
    $("fb").innerHTML = `<span class="${r.correct?"ok":"bad"}">${r.correct?`Correct! +${r.points}`:"Wrong"}</span><div class="meta">${esc(r.explanation)}</div>` +
      (S.battle ? "" : `<br><button class="btn" onclick="S.keep=true;loadQ()">Next →</button>`);
    if (S.battle) setTimeout(() => { if (S.t > 0) loadQ(); }, 700);
  } catch(e){ $("fb").innerHTML = "<span class='bad'>Server error</span>"; S.locked = false; }
}

/* ---------- Brain Battle ---------- */
function battleIntro(){
  $("view").innerHTML = `<div class="card"><h3>⚡ Brain Battle</h3>
    <div class="meta">60 seconds. Easy 10 · Medium 20 · Hard 30 points. Wrong answer = 0 points and combo reset. 3 correct in a row = +15 combo bonus. Time khatam hone ke baad answers count nahi honge.</div><br>
    <button class="btn" onclick="startBattle()">Start</button></div><button class="btn" onclick="hub()">← Menu</button>`;
}
async function startBattle(){
  try { await api(`/arena/battle/start?username=${encodeURIComponent(user)}`, {method:"POST"}); } catch(e){ return alert("Server connect nahi ho paya"); }
  S = {battle:true, game:"mix", level:0, score:0, att:0, ok:0, t:60, keep:false};
  S.began = Date.now();
  clearInterval(T);
  T = setInterval(() => { S.t = Math.max(0, 60 - Math.floor((Date.now()-S.began)/1000)); const el=$("tm"); if (el) el.textContent = S.t; if (S.t <= 0) endBattle(); }, 250);
  loadQ();
}
function endBattle(){
  clearInterval(T);
  const acc = S.att ? Math.round(S.ok*100/S.att) : 0;
  $("view").innerHTML = `<div class="card"><h3>⏱ Time's up!</h3>
    <div class="bar"><div><small>Score</small><b>${S.score}</b></div><div><small>Accuracy</small><b>${acc}%</b></div><div><small>Correct</small><b>${S.ok}/${S.att}</b></div></div>
    <button class="btn" onclick="startBattle()">Play Again</button> <button class="btn" onclick="hub()">Menu</button></div>`;
  S.battle = false;
}

/* ---------- River Crossing ---------- */
let R;
const ICON = {wolf:"🐺", goat:"🐐", cabbage:"🥬"};
function river(){ R = {L:["wolf","goat","cabbage"], R:[], boat:"L", sel:null, moves:0, msg:""}; drawRiver(); }
function drawRiver(){
  const bank = side => `<div class="bank ${side}">${R[side].map(i => `<button class="btn it ${R.sel===i?"sel":""}" ${R.boat===side?"":"disabled"} onclick="R.sel=(R.sel==='${i}'?null:'${i}');drawRiver()" aria-label="${i}">${ICON[i]}</button>`).join("")}</div>`;
  const won = R.L.length === 0;
  $("view").innerHTML = `<div class="card"><h3>🛶 River Crossing</h3>
    <div class="meta">Boat mein farmer + max 1 item. Wolf+goat ya goat+cabbage akele chhodne par khaa jayenge.</div>
    <div class="river">${bank("L")}<div class="water">${R.boat==="L"?"⛵ ←":"→ ⛵"}</div>${bank("R")}</div>
    <div class="bar"><div><small>Moves</small><b>${R.moves}</b></div><div><small>Carrying</small><b>${R.sel?ICON[R.sel]:"nothing"}</b></div></div>
    <div id="rm" class="${won?"ok":"bad"}">${won?`🎉 Solved in ${R.moves} moves! Minimum possible: 7.`:esc(R.msg)}</div><br>
    ${won ? `<button class="btn" onclick="river()">Play Again</button>` : `<button class="btn" onclick="cross()">Cross the river</button>`}</div>
    <button class="btn" onclick="hub()">← Menu</button>`;
}
function cross(){
  const from = R.boat, to = from === "L" ? "R" : "L";
  const left = R[from].filter(i => i !== R.sel);                      // jo kinare par chhoot jaayenge
  const has = x => left.includes(x);
  if (has("wolf") && has("goat")) { R.msg = "Invalid: wolf goat ko khaa jayega."; return drawRiver(); }
  if (has("goat") && has("cabbage")) { R.msg = "Invalid: goat cabbage khaa jayegi."; return drawRiver(); }
  if (R.sel) { R[to].push(R.sel); R[from] = left; }
  R.boat = to; R.sel = null; R.moves++; R.msg = ""; drawRiver();
}

/* ---------- Hidden Anomaly (15s) ---------- */
function drawAnomaly(){
  const q = S.q; clearInterval(T); let t = 15;
  $("view").innerHTML = `
    <div class="bar"><div><small>Score</small><b>${S.score}</b></div><div><small>Correct</small><b>${S.ok}/${S.att}</b></div><div><small>Time</small><b id="tm">15</b></div></div>
    <div class="card"><span class="badge">Level ${q.level}</span><div class="q">Find the odd one out</div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">
      ${q.options.map((c,i) => `<button class="btn" style="padding:6px;font-size:22px" aria-label="Cell ${i+1}" onclick="pickCell(${i})">${esc(c)}</button>`).join("")}
    </div><div id="fb" style="margin-top:10px"></div></div>
    <button class="btn" onclick="clearInterval(T);S.keep=false;hub()">← Menu</button>`;
  T = setInterval(() => {
    t--; const el = $("tm"); if (el) el.textContent = t;
    if (t <= 0) {
      clearInterval(T); S.locked = true; S.att++;
      $("fb").innerHTML = '<span class="bad">Time up!</span><br><button class="btn" onclick="S.keep=true;loadQ()">Next →</button>';
    }
  }, 1000);
}
function pickCell(i){ clearInterval(T); submit(String(i)); }

/* ---------- Escape the Digital Room ---------- */
let E;
const LOCKS = ["", "Numerical pattern", "Hidden clue", "Cipher"];
const timeLeft = () => Math.max(0, 90 - Math.floor((Date.now() - E.began) / 1000) - E.pen);
function escape(){
  E = {st:1, began:Date.now(), pen:0, score:0, busy:false};
  clearInterval(T);
  T = setInterval(() => { const l = timeLeft(); const el = $("tm"); if (el) el.textContent = l; if (l <= 0) escEnd(false); }, 250);
  loadLock();
}
async function loadLock(){
  try { E.q = await api(`/arena/q?game=lock${E.st}&level=0&username=${encodeURIComponent(user)}`); drawLock(""); }
  catch(e){ clearInterval(T); $("view").innerHTML = "<div class='card bad'>Server connect nahi ho paya.</div><button class='btn' onclick='hub()'>← Menu</button>"; }
}
function drawLock(msg){
  $("view").innerHTML = `
    <div class="bar"><div><small>Lock</small><b>${E.st}/3</b></div><div><small>Score</small><b>${E.score}</b></div><div><small>Time</small><b id="tm">${timeLeft()}</b></div></div>
    <div class="card"><h3>🔒 Lock ${E.st}: ${LOCKS[E.st]}</h3><div class="q">${esc(E.q.prompt)}</div>
    <input id="ans" placeholder="Enter code" autocomplete="off" onkeydown="if(event.key==='Enter')tryLock()">
    <button class="btn" onclick="tryLock()">Unlock</button>
    <div class="bad" style="margin-top:8px">${msg}</div></div>
    <button class="btn" onclick="clearInterval(T);hub()">← Menu</button>`;
  $("ans").focus();
}
async function tryLock(){
  const a = $("ans").value;
  if (!a.trim() || E.busy || timeLeft() <= 0) return;
  E.busy = true;
  try {
    const r = await post("/arena/a", {username:user, token:E.q.token, answer:a, battle:false});
    E.busy = false;
    if (r.error) return drawLock(esc(r.error));
    if (r.correct) { E.score += r.points; if (E.st === 3) return escEnd(true); E.st++; return loadLock(); }
    E.pen += 5; drawLock("Wrong code. −5 seconds!");
  } catch(e){ E.busy = false; drawLock("Server error"); }
}
function escEnd(win){
  clearInterval(T);
  $("view").innerHTML = `<div class="card"><h3>${win ? "🎉 You escaped!" : "⏰ Time expired"}</h3>
    <div class="bar"><div><small>Score</small><b>${E.score}</b></div><div><small>Locks opened</small><b>${win ? 3 : E.st - 1}/3</b></div><div><small>Time left</small><b>${timeLeft()}s</b></div></div>
    <button class="btn" onclick="escape()">Play Again</button> <button class="btn" onclick="hub()">Menu</button></div>`;
}

/* ---------- Leaderboard ---------- */
async function board(){
  try {
    const rows = await api("/leaderboard");
    $("view").innerHTML = "<div class='card'><h3>🏆 Leaderboard</h3>" + (rows.length ? rows.map((r,i)=>
      `<div class="row-board"><span>${["🥇","🥈","🥉"][i]||(i+1)+"."} ${esc(r.username)}</span><span>${r.xp} pts · ${r.solved} solved</span></div>`).join("")
      : "Abhi koi score nahi. Pehle khelo!") + "</div><button class='btn' onclick='hub()'>← Menu</button>";
  } catch(e){ $("view").innerHTML = "<div class='card bad'>Leaderboard load nahi hua.</div><button class='btn' onclick='hub()'>← Menu</button>"; }
}

if (!user) $("view").innerHTML = "<div class='card bad'>Pehle login karo, phir arena kholo.</div>"; else hub();
</script>
</body>
</html>
