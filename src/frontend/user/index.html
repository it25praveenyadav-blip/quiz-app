<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quiz Quest</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="levels-bg">
  <script>
    if (!localStorage.getItem('currentUser')) window.location.href = 'signin.html';
  </script>

  <button id="musicToggleBtn" onclick="toggleBgMusic()" style="position:fixed; top:20px; right:20px; z-index:10; background:#1a1a3d; border:2px solid #00f5ff; color:#00f5ff; border-radius:50%; width:44px; height:44px; font-size:1.1rem; cursor:pointer;">🔊</button>

  <div class="wood-frame">
    <div class="parchment-inner" style="text-align:center;">
      <div style="font-size:2.5rem; margin-bottom:8px;">🎮</div>
      <h1 class="wood-title" style="font-size:1.8rem;">QUIZ QUEST</h1>
      <p id="userGreeting" style="color:#5a3a1a; font-size:0.9rem; margin-bottom:6px;"></p>
      <p style="color:#6b5a3a; font-size:0.85rem; margin-bottom:20px;">Test your brain. Unlock every level.</p>

      <button class="wood-btn-full" onclick="window.location.href='categories.html'">▶ START GAME</button>

      <div class="wood-btn-row" style="margin-top:15px;">
        <button class="wood-btn" onclick="window.location.href='profile.html'" style="font-size:0.8rem; padding:10px 6px;">👤 Profile</button>
        <button class="wood-btn" onclick="window.location.href='leaderboard.html'" style="font-size:0.8rem; padding:10px 6px;">🏆 Scores</button>
        <button class="wood-btn" onclick="window.location.href='settings.html'" style="font-size:0.8rem; padding:10px 6px;">⚙️ Settings</button>
      </div>

      <p style="color:#8a7a5a; font-size:0.75rem; margin-top:18px;">20 Levels • 4 Options Each • Beat Your Score</p>
    </div>
  </div>

  <script>
    document.getElementById('userGreeting').textContent =
      'Welcome, ' + localStorage.getItem('currentUser');
  </script>

  <script src="js/bgmusic.js"></script>
</body>
</html>
