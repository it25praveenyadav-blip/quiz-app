<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="levels-bg">
  <a href="index.html" class="home-btn">🏠 Home</a>
  <button id="musicToggleBtn" onclick="toggleBgMusic()" style="position:fixed; top:20px; right:20px; z-index:10; background:#1a1a3d; border:2px solid #00f5ff; color:#00f5ff; border-radius:50%; width:44px; height:44px; font-size:1.1rem; cursor:pointer;">🔊</button>

  <div class="wood-frame">
    <div class="parchment-inner" style="text-align:center;">
      <h2 class="wood-title">👤 PROFILE</h2>
      <p id="profileName" style="color:#5a3a1a; font-weight:bold; margin-bottom:15px;"></p>
      <div class="stats-grid" id="statsGrid"></div>
      <h3 style="margin:18px 0 8px; color:#a06818;">Badges</h3>
      <div class="badges-grid" id="badgesGrid"></div>
      <button class="wood-btn-full" onclick="logout()">LOGOUT</button>
    </div>
  </div>

  <script src="js/profile.js"></script>
  <script src="js/bgmusic.js"></script>
</body>
</html>
