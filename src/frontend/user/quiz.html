<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body class="levels-bg quiz-screen">
  <button id="musicToggleBtn" onclick="toggleBgMusic()" style="position:fixed; top:20px; right:20px; z-index:10; background:#1a1a3d; border:2px solid #00f5ff; color:#00f5ff; border-radius:50%; width:44px; height:44px; font-size:1.1rem; cursor:pointer;">🔊</button>

  <div class="quiz-toolbar">
    <button class="wood-btn quiz-menu-button" onclick="openQuizMenu()">☰ Menu</button>
    <span class="quiz-coin-balance" id="coinBalance" aria-live="polite">🪙 Coins: 0</span>
    <span class="quiz-coin-balance" id="extraChanceBalance" aria-live="polite">🎁 Chances: 0</span>
    <span class="quiz-coin-balance">5 coins = +1 chance</span>
  </div>

  <main class="wood-frame quiz-frame">
    <div class="parchment-inner quiz-panel">
      <div class="question-ribbon" aria-hidden="true"><span>QUESTION</span></div>
      <div class="quiz-header" style="color:#3a2a1a;">
        <span id="levelLabel">LEVEL 1</span>
        <span id="timerLabel">⏱ 20</span>
        <span id="scoreLabel">Score: 0</span>
      </div>

      <div class="progress-bar-outer" style="background:#c9b888;">
        <div class="progress-bar-inner" id="progressBar" style="background:linear-gradient(90deg,#ffe066,#e0a830);"></div>
      </div>
      <p class="progress-text" style="color:#6b5a3a;" id="progressText">Question 1 of 1</p>

      <p id="questionText" class="quiz-question-text">Loading question...</p>

      <button class="wood-btn" id="playSoundBtn" style="display:none; width:100%; margin-bottom:12px;" onclick="replayMelody()">🔊 Listen to the Tune</button>
      <p id="audioStatus" class="audio-status" aria-live="polite" style="display:none;"></p>

      <div class="options-grid" id="optionsGrid"></div>

      <button class="wood-btn" id="hintBtn" style="width:100%; margin-top:12px;" onclick="useHint()">💡 50-50 Hint</button>
      <button class="wood-btn coin-collect-button" id="collectCoinBtn" style="display:none;" onclick="collectCoin()">🪙 Collect +1 Coin</button>
      <button class="wood-btn coin-collect-button" id="extraChanceBtn" style="display:none;" onclick="useExtraChance()">🎁 Use Extra Chance</button>
      <button class="wood-btn-full" id="nextBtn" style="display:none;" onclick="nextQuestion()">NEXT ▶</button>
    </main>
  </div>

  <div class="quiz-menu-overlay" id="quizMenu" role="dialog" aria-modal="true" aria-labelledby="quizMenuTitle" aria-hidden="true">
    <div class="quiz-menu-panel">
      <h2 id="quizMenuTitle">Quiz Menu</h2>
      <button class="wood-btn-full" onclick="resumeQuiz()">▶ Resume</button>
      <button class="wood-btn" onclick="restartQuiz()">↻ Restart Level</button>
      <button class="wood-btn" onclick="goToHome()">🏠 Home</button>
      <button class="wood-btn quiz-quit-button" onclick="quitQuiz()">✖ Quit to Levels</button>
    </div>
  </div>

  <script src="js/sports.js"></script>
  <script src="js/temples.js"></script>
  <script src="js/songs.js"></script>
  <script src="js/melodies.js"></script>
  <script src="js/economics.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/bgmusic.js"></script>
</body>
</html>
