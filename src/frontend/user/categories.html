<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Select Category</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body class="levels-bg categories-screen">
  <main class="category-app">
    <div class="category-content">
      <header class="category-welcome">
        <div>
          <p class="category-greeting" id="categoryGreeting">Hi, player</p>
          <p class="category-tagline">Ready to learn something new?</p>
        </div>
        <div class="category-header-actions">
          <button id="musicToggleBtn" class="category-music-button" type="button" onclick="toggleBgMusic()" aria-label="Toggle background music">🔊</button>
          <a href="profile.html" class="category-avatar" id="categoryAvatar" aria-label="Open profile">P</a>
        </div>
      </header>

      <section class="category-stats" aria-label="Your progress">
        <div class="category-stat-card">
          <span class="category-stat-icon" aria-hidden="true">🏆</span>
          <span class="category-stat-copy">
            <span class="category-stat-label">Levels</span>
            <strong id="categoryLevels">0</strong>
          </span>
        </div>
        <div class="category-stat-card">
          <span class="category-stat-icon" aria-hidden="true">🪙</span>
          <span class="category-stat-copy">
            <span class="category-stat-label">Points</span>
            <strong id="categoryPoints">0</strong>
          </span>
        </div>
      </section>

      <section class="category-selection" aria-labelledby="categoryHeading">
        <h1 id="categoryHeading">Let’s play</h1>
        <div class="category-card-grid" id="categoryGrid"></div>
      </section>
    </div>
  </main>

  <script src="js/sports.js"></script>
  <script src="js/temples.js"></script>
  <script src="js/songs.js"></script>
  <script src="js/economics.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/bgmusic.js"></script>
</body>
</html>
